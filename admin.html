<html lang="en" dir="ltr">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#f2f2f1;--bg2:#e6e6e4;--card:#fbfbfa;--tx:#1d1d1d;--mut:#454545;--gold:#585858;--bd:#d5d5d3;--ink:#1d1d1d;--onink:#f2f2f1;--ok:#2f7a58;--warn:#8a6410;--bad:#a8403a;--info:#3f6285}
[data-theme=dark]{--bg:#121212;--bg2:#1a1a1a;--card:#1f1f1f;--tx:#ececeb;--mut:#bdbdbb;--gold:#b9b9b7;--bd:#343434;--ink:#ececeb;--onink:#121212;--ok:#5cb88e;--warn:#d6a93f;--bad:#e0786f;--info:#8fb2d6}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 Jost,system-ui,sans-serif;transition:background .3s,color .3s}
[dir=rtl] body{font-family:Tajawal,system-ui,sans-serif;font-weight:400}
h1,h2,h3{font:500 1.4rem/1.15 'Cormorant Garamond',Georgia,serif;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,6vw,4.6rem)}h2{font-size:clamp(1.9rem,3.5vw,3rem)}
[dir=rtl] :is(h1,h2,h3){font-family:Amiri,serif;line-height:1.4}
a{color:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.8em 1.6em;border:1px solid var(--ink);background:transparent;color:var(--tx);font:inherit;font-weight:400;cursor:pointer;text-decoration:none;transition:.25s}
.btn:hover{background:var(--ink);color:var(--onink)}
.btn.solid{background:var(--ink);color:var(--onink)}.btn.solid:hover{background:var(--gold);border-color:var(--gold);color:var(--onink)}
.btn:disabled{opacity:.5;cursor:wait}.btn.sm{padding:.35em 1em;font-size:.85rem}
input,select,textarea{width:100%;padding:.75em .9em;background:var(--card);color:var(--tx);border:1px solid var(--bd);font:inherit;border-radius:0}
label{display:block;font-size:.88rem;margin:0 0 .3em;color:var(--mut)}
.badge{display:inline-block;padding:0 .7em;border:1px solid currentColor;font-size:.8rem}
.s-pending{color:var(--warn)}.s-confirmed{color:var(--ok)}.s-rejected,.s-cancelled{color:var(--bad)}.s-completed{color:var(--info)}
.msg{padding:.8em 1em;border:1px solid var(--bd);margin:1em 0}.msg:empty{display:none}.msg.ok{border-color:var(--ok);color:var(--ok)}.msg.err{border-color:var(--bad);color:var(--bad)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5}
.ibtn{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;text-decoration:none;font-size:1.1rem}.ibtn:hover{border-color:var(--gold);color:var(--gold)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:16px;min-height:68px}
.logo img{height:46px;display:block}
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
#lang{width:auto;padding:.45em}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* rounded look */
:root{--r:18px;--fb:#a3a3a0}[data-theme=dark]{--fb:#666}
.btn,.badge{border-radius:999px}.btn.sm{padding:.4em 1.1em}
input,select,textarea{border-radius:14px;border-color:var(--fb);padding:.8em 1em}
.ibtn{border-radius:50%;border-color:var(--fb)}
.msg{border-radius:14px}.logo img{border-radius:10px}.stat,dialog{border-radius:var(--r)}
</style>
<script>document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<style>
[hidden]{display:none!important}
main{padding:32px 0 64px}
#login{max-width:420px;margin:40px auto}#login form>*{margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--bd);padding:14px 16px}.stat b{display:block;font:500 2rem 'Cormorant Garamond',serif}.stat span{color:var(--mut);font-size:.85rem}
.tb{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:10px;margin-bottom:16px}
@media(max-width:800px){.tb{grid-template-columns:1fr 1fr}.tb input:first-child{grid-column:1/-1}}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd)}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--bd);font-size:.92rem}th{color:var(--mut);font-weight:400}
@media(max-width:800px){thead{display:none}tr{display:block;border:1px solid var(--bd);margin:0 0 12px;padding:6px;background:var(--card)}table{border:0;background:none}td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 6px}td::before{content:attr(data-l);color:var(--mut)}}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);max-width:560px;width:calc(100% - 32px);padding:24px}dialog::backdrop{background:rgba(0,0,0,.5)}
dialog dt{color:var(--mut);font-size:.82rem;margin-top:10px}dialog dd{margin:0;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
</style>
</head>

<header class="top"><div class="wrap bar">
 <a class="logo" href="admin.html"><img data-m alt="Cesar Medical Aesthetics Dr Bellagh logo" width="64" height="46"></a>
 <strong data-i18n="title"></strong>
 <div class="tools">
  <select id="lang" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">ع</option></select>
  <button class="ibtn" id="theme" data-aria="theme" type="button">◐</button>
  <button class="btn sm" id="out" type="button" hidden data-i18n="logout"></button>
 </div>
</div></header>
<main class="wrap">
<section id="login" hidden>
 <h2 data-i18n="signin"></h2>
 <form id="lf"><div><label for="em" data-i18n="email"></label><input id="em" type="email" autocomplete="username" required></div>
 <div><label for="pw" data-i18n="pw"></label><input id="pw" type="password" autocomplete="current-password" required></div>
 <button class="btn solid" id="lb" type="submit" data-i18n="signin"></button>
 <button class="link" id="fg" type="button" data-i18n="forgot"></button></form>
</section>
<div id="gm" class="msg" role="status" aria-live="polite"></div>
<section id="dash" hidden>
 <div class="stats" id="stats"></div>
 <div class="tb">
  <input id="q" type="search" data-aria="search" aria-label="Search">
  <select id="fs" data-aria="status" aria-label="Status"></select>
  <input id="fd" type="date" data-aria="date" aria-label="Date">
  <button class="btn" id="so" type="button"></button>
  <button class="btn" id="rf" type="button" data-i18n="refresh"></button>
 </div>
 <table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table>
</section>
</main>

<script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let L=localStorage.lang,T={},onLang=()=>{};
const t=(k,v={})=>String((T[L]||{})[k]??T.en[k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
function applyLang(){
 const h=document.documentElement;h.lang=L;h.dir=L==='ar'?'rtl':'ltr';
 $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 $$('[data-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.aria)));
 $('#lang').value=L;onLang();
}
function initUI(dict,cb){
 T=dict;if(!T[L])L='en';onLang=cb||onLang;
 $('#lang').onchange=e=>{L=e.target.value;localStorage.lang=L;applyLang()};
 $('#theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.theme=n};
 applyLang();
}
</script>

function paint(){
 const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
 const n=s=>rows.filter(r=>r.status===s).length;
 $('#stats').innerHTML=[['tot',rows.length],['today',rows.filter(r=>r.appointment_date===today).length],...ST.map(s=>[s,n(s)])].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${t(k)}</span></div>`).join('');
 const q=$('#q').value.trim().toLowerCase(),fs=$('#fs').value,fd=$('#fd').value;
 const list=rows.filter(r=>(!q||r.customer_name.toLowerCase().includes(q)||r.phone.includes(q))&&(!fs||r.status===fs)&&(!fd||r.appointment_date===fd))
  .sort((a,b)=>((a.appointment_date+a.appointment_time)<(b.appointment_date+b.appointment_time)?-1:1)*(asc?1:-1));
 $('#th').innerHTML=['id','name','phone','svc','when','status',''].map(k=>`<th>${k?t(k):''}</th>`).join('');
 $('#tb').innerHTML=list.length?list.map(r=>`<tr><td data-l="${t('id')}">${esc(r.id.slice(0,8).toUpperCase())}</td><td data-l="${t('name')}">${esc(r.customer_name)}</td><td data-l="${t('phone')}" dir="ltr">${esc(r.phone)}</td><td data-l="${t('svc')}">${esc(r.service)}</td><td data-l="${t('when')}">${esc(r.appointment_date)} ${esc(r.appointment_time.slice(0,5))}</td><td data-l="${t('status')}"><span class="badge s-${r.status}">${t(r.status)}</span></td><td><button class="btn sm" data-v="${r.id}" type="button">${t('view')}</button></td></tr>`).join(''):`<tr><td>${t('empty')}</td></tr>`;

function ui(){
 const v=$('#fs').value;$('#fs').innerHTML=`<option value="">${t('all')}</option>`+ST.map(s=>`<option value="${s}">${t(s)}</option>`).join('');$('#fs').value=v;
 $('#so').textContent=t(asc?'sortA':'sortD');$('#q').placeholder=t('search');
 if(gk)gm(gk,$('#gm').classList.contains('ok')?'ok':'err');
 if(!$('#dash').hidden)paint();
}
async function load(){
 const{data,error}=await sb.from('appointments').select('*').order('appointment_date',{ascending:false}).limit(1000);
 if(error)return gm('eLoad');
 gm(null);rows=data;paint();
}
function show(r){
 const f=[['name',r.customer_name],['phone',r.phone],['email2',r.email||'—'],['svc',r.service],['when',r.appointment_date+' '+r.appointment_time.slice(0,5)],['msg',r.message||'—'],['sub',fmt(r.created_at)]];
 $('#dlg').innerHTML=`<h3 id="dt">${esc(r.id.slice(0,8).toUpperCase())} <span class="badge s-${r.status}">${t(r.status)}</span></h3><dl>${f.map(([k,v])=>`<dt>${t(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
 <div class="acts">${(NX[r.status]||[]).map(s=>`<button class="btn sm ${s==='confirmed'?'solid':''}" data-id="${r.id}" data-s="${s}" type="button">${t(AK[s])}</button>`).join('')}<button class="btn sm" data-x type="button">${t('close')}</button></div>`;
 $('#dlg').showModal();
}
async function setSt(id,s){
 if(!confirm(t('ask',{s:t(s)})))return;
 const{data,error}=await sb.from('appointments').update({status:s}).eq('id',id).select('id');
 if(error||!data.length)return gm('eSave');
 $('#dlg').close();gm('saved','ok');load();
}
async function enter(u){
 const{data,error}=await sb.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();return gate('noAccess')}
 $('#login').hidden=true;$('#dash').hidden=false;$('#out').hidden=false;gm(null);await load();paint();
 if(!chan)chan=sb.channel('appts').on('postgres_changes',{event:'*',schema:'public',table:'appointments'},load).subscribe();
}
function gate(k){
 $('#dash').hidden=true;$('#out').hidden=true;$('#login').hidden=false;rows=[];
 if(chan){sb.removeChannel(chan);chan=null}
 if(k)gm(k);
}
initUI(D,ui);
$('#so').onclick=()=>{asc=!asc;ui()};
['q','fs','fd'].forEach(i=>$('#'+i).oninput=paint);
$('#rf').onclick=load;
$('#tb').onclick=e=>{const b=e.target.closest('[data-v]');if(b)show(rows.find(r=>r.id===b.dataset.v))};
$('#dlg').onclick=e=>{const b=e.target.closest('button');if(!b)return;if('x'in b.dataset)$('#dlg').close();else if(b.dataset.s)setSt(b.dataset.id,b.dataset.s)};
if(!sb){gate('noCfg')}else{
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#lb').disabled=true;
  const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  $('#lb').disabled=false;$('#pw').value='';
  if(error)return gm('eLogin');enter(data.user)};
 $('#fg').onclick=async()=>{const em=$('#em').value.trim();if(!em)return $('#em').focus();
  await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});gm('resetSent','ok')};
 $('#out').onclick=()=>sb.auth.signOut();
 sb.auth.onAuthStateChange((ev)=>{
  if(ev==='SIGNED_OUT')gate();
  if(ev==='PASSWORD_RECOVERY')setTimeout(async()=>{const p=prompt(t('newpw'));if(p&&p.length>=8){const{error}=await sb.auth.updateUser({password:p});gm(error?'eSave':'saved',error?'err':'ok')}},0);
 });
 sb.auth.getSession().then(({data})=>data.session?enter(data.session.user):gate());
}
</script>
</body>
</html>
