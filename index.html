<style>:root{--bg:#f2f2f1;--bg2:#e6e6e4;--card:#fbfbfa;--tx:#1d1d1d;--mut:#454545;--gold:#585858;--bd:#d5d5d3;--ink:#1d1d1d;--onink:#f2f2f1;--ok:#2f7a58;--warn:#8a6410;--bad:#a8403a;--info:#3f6285}
[data-theme=dark]{--bg:#121212;--bg2:#1a1a1a;--card:#1f1f1f;--tx:#ececeb;--mut:#bdbdbb;--gold:#b9b9b7;--bd:#343434;--ink:#ececeb;--onink:#121212;--ok:#5cb88e;--warn:#d6a93f;--bad:#e0786f;--info:#8fb2d6}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 Jost,system-ui,sans-serif;transition:background .3s,color .3s}
[dir=rtl] body{font-family:Tajawal,system-ui,sans-serif;font-weight:400}
h1,h2,h3{font:500 1.4rem/1.15 'Cormorant Garamond',Georgia,serif;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,6vw,4.6rem)}h2{font-size:clamp(1.9rem,3.5vw,3rem)}
[dir=rtl] :is(h1,h2,h3){font-family:Amiri,serif;line-height:1.4}
a{color:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.8em 1.6em;border:1px solid var(--ink);background:transparent;color:var(--tx);font:inherit;font-weight:400;cursor:pointer;text-decoration:none;transition:.25s}
.btn:hover{background:var(--ink);color:var(--onink)}
.btn.solid{background:var(--ink);color:var(--onink)}.btn.solid:hover{background:var(--gold);border-color:var(--gold);color:var(--onink)}
.btn:disabled{opacity:.5;cursor:wait}.btn.sm{padding:.35em 1em;font-size:.85rem}
input,select,textarea{width:100%;padding:.75em .9em;background:var(--card);color:var(--tx);border:1px solid var(--bd);font:inherit;border-radius:0}
label{display:block;font-size:.88rem;margin:0 0 .3em;color:var(--mut)}
.badge{display:inline-block;padding:0 .7em;border:1px solid currentColor;font-size:.8rem}
.s-pending{color:var(--warn)}.s-confirmed{color:var(--ok)}.s-rejected,.s-cancelled{color:var(--bad)}.s-completed{color:var(--info)}
.msg{padding:.8em 1em;border:1px solid var(--bd);margin:1em 0}.msg:empty{display:none}.msg.ok{border-color:var(--ok);color:var(--ok)}.msg.err{border-color:var(--bad);color:var(--bad)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5}
.ibtn{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;text-decoration:none;font-size:1.1rem}.ibtn:hover{border-color:var(--gold);color:var(--gold)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:16px;min-height:68px}
.logo img{height:46px;display:block}
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
#lang{width:auto;padding:.45em}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* rounded look */
:root{--r:18px;--fb:#a3a3a0}[data-theme=dark]{--fb:#666}
.btn,.badge{border-radius:999px}.btn.sm{padding:.4em 1.1em}
input,select,textarea{border-radius:14px;border-color:var(--fb);padding:.8em 1em}
.ibtn{border-radius:50%;border-color:var(--fb)}
.msg{border-radius:14px}.logo img{border-radius:10px}.stat,dialog{border-radius:var(--r)}
</style>

<style>
nav{display:flex;gap:24px;margin-inline-start:auto;font-size:.92rem}nav a{text-decoration:none;color:var(--mut)}nav a:hover{color:var(--tx)}
.tools{margin-inline-start:0}.m,#burger{display:none}
@media(max-width:980px){#burger{display:inline-grid}nav{display:none;position:absolute;top:100%;inset-inline:0;flex-direction:column;background:var(--bg);padding:20px 24px;border-bottom:1px solid var(--bd);margin:0}nav.open{display:flex}.tools{margin-inline-start:auto}.tools .btn{display:none}.m{display:inline-flex}}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:64px 0 88px}
.hero p{max-width:34em;color:var(--mut);font-size:1.1rem}.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.frame{position:relative;animation:in 1.1s ease both}.frame img{width:100%;height:auto;object-fit:contain;display:block;border-radius:32px;box-shadow:0 24px 60px rgba(0,0,0,.22);border:6px solid var(--card)}
@keyframes in{from{opacity:0;transform:translateY(24px)}}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:40px;padding:40px 0 64px}}
section.sec{padding:80px 0;border-top:1px solid var(--bd)}section.alt{background:var(--bg2)}
.lead{max-width:44em;color:var(--mut);font-size:1.08rem}#bf{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:28px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.fg img{border-radius:12px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px;margin-top:40px}
.cat{padding:28px;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);box-shadow:0 4px 18px rgba(0,0,0,.06)}.cat h3{font-size:1.7rem;margin-bottom:.5em}
.cat ul{list-style:none;margin:0;padding:0}.cat li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd);font-size:1.02rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;margin-top:32px}
.cols>div{padding:22px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);font-size:1.05rem;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.steps{counter-reset:s}.steps>div::before{counter-increment:s;content:counter(s);font:500 2.4rem 'Cormorant Garamond',serif;color:var(--gold);display:block}
details{border:1px solid var(--bd);border-radius:var(--r);background:var(--card);padding:16px 22px;margin-bottom:12px}summary{cursor:pointer;font-size:1.1rem}details p{margin:.6em 0 0;color:var(--mut)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px}@media(max-width:820px){.split{grid-template-columns:1fr}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
form>div{margin-bottom:16px}.chk{display:flex;gap:10px;align-items:flex-start}.chk input{width:auto;margin-top:.45em}.chk label{margin:0}
dl{margin:0}dt{color:var(--mut);font-size:.92rem;margin-top:14px}dd{margin:0;font-size:1.12rem}
.mapcard{border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid var(--bd);background:var(--card);padding:32px;display:grid;gap:16px;align-content:center;justify-items:start;min-height:260px}
.mapcard .ic{width:34px;height:34px;color:var(--gold)}.soc{display:flex;gap:10px;margin-top:20px}
footer{background:var(--bg2);border-top:1px solid var(--bd);padding:56px 0 28px;font-size:.92rem}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}.fg a{display:block;color:var(--mut);text-decoration:none;padding:2px 0}.fg a:hover{color:var(--tx)}.fg img{height:70px}
.small{color:var(--mut);font-size:.85rem;margin-top:32px}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
</style>

const sb=(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_KEY&&window.supabase)?supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY):null;
function render(){
 const i=L==='fr'?1:L==='ar'?2:0;
 $('#cats').innerHTML=SV.map(c=>`<article class="cat"><h3>${c.n[i]}</h3><ul>${c.s.map(s=>`<li><span>${s[i]}</span><button class="btn sm" type="button" data-svc="${s[0]}">${t('bk')}</button></li>`).join('')}</ul></article>`).join('');
 const sel=$('#fs'),cur=sel.value;
 sel.innerHTML=`<option value="">${t('choose')}</option>`+SV.map(c=>`<optgroup label="${c.n[i]}">${c.s.map(s=>`<option value="${s[0]}">${s[i]}</option>`).join('')}</optgroup>`).join('');sel.value=cur;
 $('#fcats').innerHTML=SV.map(c=>`<a href="#services">${c.n[i]}</a>`).join('');
 $('#bs').textContent=t('send');
 const C=CONFIG,r=[];
 if(C.ADDRESS)r.push([t('caddr'),esc(C.ADDRESS)]);
 if(C.PHONE)r.push([t('cphone'),`<a href="tel:${esc(C.PHONE.replace(/[^+\d]/g,''))}">${esc(C.PHONE)}</a>`]);
 if(C.WHATSAPP)r.push(['WhatsApp',`<a href="https://wa.me/${C.WHATSAPP.replace(/\D/g,'')}" target="_blank" rel="noopener noreferrer">${esc(C.WHATSAPP)}</a>`]);
 if(C.EMAIL)r.push([t('cmail'),`<a href="mailto:${esc(C.EMAIL)}">${esc(C.EMAIL)}</a>`]);
 if(C.HOURS)r.push([t('chours'),esc(C.HOURS)]);
 $('#cinfo').innerHTML=r.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
}
initUI(D,render);
$('#yr').textContent=new Date().getFullYear();
$('#fd').min=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
$('#burger').onclick=e=>{const o=$('#nav').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
$('#nav').onclick=e=>{if(e.target.closest('a')){$('#nav').classList.remove('open');$('#burger').setAttribute('aria-expanded',false)}};
$('#cats').onclick=e=>{const b=e.target.closest('[data-svc]');if(!b)return;$('#fs').value=b.dataset.svc;$('#book').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('#fs').focus({preventScroll:true}),500)};
if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});$$('.rv').forEach(e=>io.observe(e))}else $$('.rv').forEach(e=>e.classList.add('in'));
let busy=false;
$('#bf').onsubmit=async e=>{
 e.preventDefault();if(busy)return;
 const f=e.target,v=Object.fromEntries(new FormData(f)),m=$('#bm'),b=$('#bs');
 const show=(c,k,p)=>{m.className='msg '+c;m.textContent=t(k,p)};
 if(!v.name.trim()||!v.phone.trim()||!v.service||!v.date||!v.time||!f.consent.checked)return show('err','eReq');
 if(!/^\+?[0-9 ()\-.]{6,20}$/.test(v.phone.trim())||v.phone.replace(/\D/g,'').length<6)return show('err','ePhone');
 const today=new Date();today.setHours(0,0,0,0);if(new Date(v.date+'T00:00')<today)return show('err','ePast');
 if(!sb)return show('err','eCfg');
 busy=true;b.disabled=true;b.textContent=t('sending');
 try{
  const{data,error}=await sb.rpc('submit_appointment',{p_name:v.name,p_phone:v.phone,p_email:v.email||null,p_service:v.service,p_date:v.date,p_time:v.time,p_message:v.message||null});
  if(error)throw error;
  f.reset();show('ok','ok',{id:String(data).slice(0,8).toUpperCase()});
 }catch(err){show('err',/duplicate/i.test(err.message||'')?'eDup':'eFail')}
 finally{busy=false;b.disabled=false;b.textContent=t('send')}
};
</script>
